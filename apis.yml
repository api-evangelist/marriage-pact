name: Marriage Pact
description: Marriage Pact is a matchmaking platform that pairs people using a research-backed
  compatibility questionnaire, originally built for college campuses and run as periodic
  matching events across universities. Participants answer a values-and-preferences survey and the
  service uses the responses to compute and deliver each person their most compatible match. Backed
  by Bain Capital Ventures, the company operates as a consumer web product; as of this profile it
  publishes no public developer API, documentation portal, or programmatic integration surface.
